name: Update acquisition contact email

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-contact.yml"

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace primary acquisition email
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "governancespinesystems@outlook.com"
          new = "gssest2023@proton.me"
          for filename in ("index.html", "CONTACT_ROUTE.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected old email not found in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit contact update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CONTACT_ROUTE.md
          git commit -m "Replace primary acquisition email with Proton address"
          git push
